# Development overrides: hot reload for API and Vite dev server.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  backend:
    volumes:
      - ./backend:/app
    environment:
      UVICORN_EXTRA: "--reload"
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      VITE_API_PROXY: http://backend:8000
    volumes:
      - ./frontend/src:/app/src
    ports:
      - "5173:5173"
